name: youtube-scrapper

# Images from GHCR (built by .github/workflows/docker.yml).
# Deploy sets APP_IMAGE to a git sha tag; default is :latest.
# Reacher stays on the public reacherhq image. Optional SOCKS5 / multi-proxy
# vars live in .env — see .env.example.
services:
  reacher:
    image: reacherhq/backend:v0.11.9
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REACHER_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      RUST_LOG: ${RUST_LOG:-reacher=debug}
      RCH__BACKEND_NAME: ${RCH__BACKEND_NAME:-youtube-scrapper-reacher}
      RCH__HTTP_HOST: 0.0.0.0
      RCH__HTTP_PORT: 8080
      RCH__HELLO_NAME: ${RCH__HELLO_NAME:-chibykes.dev}
      RCH__FROM_EMAIL: ${RCH__FROM_EMAIL:-hello@chibykes.dev}
      # Gmail via SOCKS often needs 10–35s; 20s cut real answers, 45s dragged
      # bulk runs. 30s is the compromise. Recreate reacher after changing this.
      RCH__SMTP_TIMEOUT: ${RCH__SMTP_TIMEOUT:-30}
      RCH__WORKER__ENABLE: "false"
      RCH__THROTTLE__MAX_REQUESTS_PER_MINUTE: ${RCH__THROTTLE__MAX_REQUESTS_PER_MINUTE:-120}
      RCH__THROTTLE__MAX_REQUESTS_PER_DAY: ${RCH__THROTTLE__MAX_REQUESTS_PER_DAY:-10000}
      # Auth: set RCH__HEADER_SECRET (+ matching REACHER_SECRET) in .env
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 2 127.0.0.1 8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  app:
    image: ${APP_IMAGE:-ghcr.io/chibykes/youtube-scrapper/app:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-2233}:2233"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 2233
      HOSTNAME: 0.0.0.0
      REACHER_URL: http://reacher:8080
    depends_on:
      reacher:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2233/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
