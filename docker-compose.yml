name: youtube-scrapper

# Images from GHCR (built by .github/workflows/docker.yml).
# Deploy sets APP_IMAGE to a git sha tag; default is :latest.
#
# Email validation uses external Reacher at reacher-mails.dscrdbots.cc
# (no rabbitmq / postgres / workers in this compose).

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/chibykes/youtube-scrapper/app:latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-2233}:2233"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 2233
      HOSTNAME: 0.0.0.0
      REACHER_URL: https://reacher-mails.dscrdbots.cc
      REACHER_USE_BULK: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2233/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
