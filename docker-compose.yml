name: youtube-scrapper

# Local/self-host stack. App built from Dockerfile; Reacher from
# reacherhq/backend. Optional SOCKS5 / multi-proxy vars live in .env —
# see .env.example and https://docs.reacher.email/self-hosting/proxies/multiple-proxies
# Outbound SMTP (port 25) is often blocked without a proxy.
services:
  reacher:
    image: reacherhq/backend:v0.11.9
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REACHER_PORT:-8080}:8080"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      RUST_LOG: ${RUST_LOG:-reacher=info}
      RCH__BACKEND_NAME: ${RCH__BACKEND_NAME:-youtube-scrapper-reacher}
      # Must bind all interfaces so the app container can reach it
      RCH__HTTP_HOST: 0.0.0.0
      RCH__HTTP_PORT: 8080
      RCH__HELLO_NAME: ${RCH__HELLO_NAME:-localhost}
      RCH__FROM_EMAIL: ${RCH__FROM_EMAIL:-hello@localhost}
      RCH__SMTP_TIMEOUT: ${RCH__SMTP_TIMEOUT:-45}
      RCH__WORKER__ENABLE: "false"
      RCH__THROTTLE__MAX_REQUESTS_PER_MINUTE: ${RCH__THROTTLE__MAX_REQUESTS_PER_MINUTE:-60}
      RCH__THROTTLE__MAX_REQUESTS_PER_DAY: ${RCH__THROTTLE__MAX_REQUESTS_PER_DAY:-10000}
      # Auth secret: set RCH__HEADER_SECRET (and matching REACHER_SECRET) in
      # .env.local / .env — do not override here or empty host subst wipes it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/login}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/signup}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/dashboard}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/dashboard}
        NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY:-}
        NEXT_PUBLIC_YOSE_NGN_RATE: ${NEXT_PUBLIC_YOSE_NGN_RATE:-100}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-2233}:2233"
    env_file:
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 2233
      HOSTNAME: 0.0.0.0
      # In-network URL — do not use localhost from inside the app container.
      # REACHER_SECRET comes from env_file (.env.local); must match
      # RCH__HEADER_SECRET on the reacher service.
      REACHER_URL: http://reacher:8080
    depends_on:
      reacher:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:2233/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
